<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>InterestShield Hero Turntable</title>
  <script src="vendor/gsap.min.js"></script>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #101418; }
    #hero-turntable, canvas { width: 1920px; height: 1080px; display: block; }
    #hero-turntable { position: relative; }
    #turn-track { position: absolute; bottom: 42px; left: 860px; width: 200px; height: 2px; background: #38434a; }
    #turn-progress { height: 2px; width: 200px; background: #b8c8d0; transform-origin: left center; }
  </style>
</head>
<body>
  <main id="hero-turntable" data-composition-id="interestshield-hero-turntable" data-width="1920" data-height="1080" data-fps="60" data-duration="9" data-start="0" data-track-index="0" data-composition-variables='[{"id":"hero","type":"string","default":"car"}]'>
    <canvas id="hero-canvas" aria-label="Three-dimensional hero turntable"></canvas>
    <div id="turn-track" aria-hidden="true"><div id="turn-progress"></div></div>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { heroAngleAt, heroFrameDistance, HERO_CAMERA_FOV } from './vendor/hero-turntable.js';

    const names = ['car','house','land','creditCard','studentLoan','medical','personal','recreation','custom','vault'];
    const selected = window.__hfVariables?.hero || 'car';
    if (!names.includes(selected)) throw new Error('Unknown hero');
    const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('canvas'), antialias: true, alpha: true });
    renderer.setSize(1920, 1080, false);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(HERO_CAMERA_FOV, 1920 / 1080, 0.1, 50);
    camera.position.set(3.3,2.5,4.8); camera.lookAt(0,1.15,0);
    const pmrem = new THREE.PMREMGenerator(renderer), room = new RoomEnvironment();
    scene.environment = pmrem.fromScene(room,0.04).texture;
    room.dispose(); pmrem.dispose();
    scene.add(new THREE.HemisphereLight(0xffffff,0x414d52,2.5));
    const light = new THREE.DirectionalLight(0xffffff,4); light.position.set(-3,6,5); scene.add(light);
    const rim = new THREE.DirectionalLight(0xb8d9e6,3); rim.position.set(4,3,-4); scene.add(rim);
    const gltf = await new GLTFLoader().loadAsync(`vendor/heroes/${selected}.glb`);
    scene.add(gltf.scene);
    const sphere = new THREE.Box3().setFromObject(gltf.scene).getBoundingSphere(new THREE.Sphere());
    camera.position.copy(sphere.center).add(new THREE.Vector3(3.3,1.35,4.8).normalize().multiplyScalar(heroFrameDistance(sphere.radius,camera.aspect)));
    camera.lookAt(sphere.center);
    function renderAt(time) {
      gltf.scene.rotation.y = heroAngleAt(time);
      renderer.render(scene,camera);
    }
    window.addEventListener('hf-seek', event => renderAt(event.detail.time));
    const clock = { time: 0 };
    window.__timelines = window.__timelines || {};
    const timeline = gsap.timeline({ paused: true, onUpdate: () => renderAt(clock.time) });
    timeline.fromTo(clock,{time:0},{time:9,duration:9,ease:'none'},0);
    timeline.fromTo('#turn-progress',{scaleX:0},{scaleX:1,duration:8,ease:'power1.inOut'},0);
    window.__timelines['interestshield-hero-turntable'] = timeline;
    document.querySelector('main').dataset.ready = 'true';
    renderAt(window.__hfThreeTime || 0);
  </script>
</body>
</html>
