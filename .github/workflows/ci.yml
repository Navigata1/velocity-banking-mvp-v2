name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-mobile-quality:
    name: Web and mobile quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json
            apps/media/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit web runtime dependencies
        working-directory: apps/web
        run: npm audit --omit=dev

      - name: Run web regression tests
        working-directory: apps/web
        run: npm test

      - name: Run web lint
        working-directory: apps/web
        run: npm run lint

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Verify built Money Loop Three stage
        working-directory: apps/web
        run: npm run test:3d:built

      - name: Upload Money Loop Three stage proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: money-loop-three-stage
          path: apps/web/test-results/three-stage
          if-no-files-found: error

      - name: Smoke built web routes
        working-directory: apps/web
        run: npm run smoke:routes

      - name: Smoke rendered web routes
        working-directory: apps/web
        run: npm run smoke:rendered:built

      - name: Verify same-liability Simulator comparisons
        working-directory: apps/web
        run: npm run smoke:comparison:built

      - name: Upload Simulator comparison proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-comparison-proof
          path: apps/web/test-results/comparison
          if-no-files-found: warn

      - name: Verify asset hero loading, rotation and reduced motion
        working-directory: apps/web
        run: npm run test:heroes

      - name: Upload asset hero browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-hero-browser-proof
          path: apps/web/test-results/heroes
          if-no-files-found: warn

      - name: Install media workspace dependencies
        working-directory: apps/media
        run: npm ci --ignore-scripts

      - name: Read pinned Remotion Chrome version
        id: remotion-chrome-version
        shell: bash
        run: echo "version=$(cat apps/media/remotion/chrome.version)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Remotion Chrome
        id: remotion-chrome
        uses: browser-actions/setup-chrome@e574b4b3a21156ab45dd6b5f67e884fd26eed829 # v2.1.2
        with:
          chrome-version: ${{ steps.remotion-chrome-version.outputs.version }}

      - name: Check media identity contracts
        working-directory: apps/media
        env:
          CHROME_PATH: ${{ steps.remotion-chrome.outputs.chrome-path }}
        run: npm run check

      - name: Install report Worker dependencies
        working-directory: apps/report-worker
        run: npm ci

      - name: Check and test report Worker
        working-directory: apps/report-worker
        run: |
          npm run check
          npm test
          npm audit --omit=dev
          npm run build:dry-run

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Audit critical native dependency advisories
        working-directory: apps/mobile
        run: npm audit --omit=dev --audit-level=critical

      - name: Run mobile type-check
        working-directory: apps/mobile
        run: npm run check

      - name: Build Expo web export
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npm run build:web

      - name: Smoke Expo web export
        working-directory: apps/mobile
        run: npm run smoke:web-export

      - name: Smoke rendered Expo accessibility
        working-directory: apps/mobile
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.remotion-chrome.outputs.chrome-path }}
        run: npm run smoke:accessibility:built

      - name: Run mobile contract tests
        run: node scripts/mobile-port-contract-tests.cjs

      - name: Verify iOS smoke guard on Linux
        working-directory: apps/mobile
        shell: bash
        run: |
          set +e
          output="$(npm run smoke:ios 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          grep -F "iOS Expo Go smoke requires macOS with Xcode and Simulator." <<< "$output"

  backend-isolation:
    name: Isolated SQL and owner isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web contract dependencies
        run: npm --prefix apps/web ci

      - name: Check isolated database wiring
        run: node apps/web/scripts/supabase-ci-contract.cjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1

      - name: Start disposable database
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/backend-isolation"
          supabase --version | tee "$RUNNER_TEMP/backend-isolation/cli-version.log"
          supabase db start 2>&1 | tee "$RUNNER_TEMP/backend-isolation/start.log"

      - name: Replay all migrations without seed data
        shell: bash
        run: supabase db reset --local --no-seed 2>&1 | tee "$RUNNER_TEMP/backend-isolation/reset.log"

      - name: Verify client contracts and SQL owner isolation
        shell: bash
        run: npm --prefix apps/web run test:supabase 2>&1 | tee "$RUNNER_TEMP/backend-isolation/pgtap.log"

      - name: Lint application database functions
        shell: bash
        run: supabase db lint --local --schema public --fail-on warning 2>&1 | tee "$RUNNER_TEMP/backend-isolation/lint.log"

      - name: Check database security advisors
        shell: bash
        run: supabase db advisors --local --type security --fail-on error 2>&1 | tee "$RUNNER_TEMP/backend-isolation/security-advisors.log"

      - name: Repeat SQL tests to verify fixture rollback
        shell: bash
        run: supabase test db --local supabase/tests 2>&1 | tee "$RUNNER_TEMP/backend-isolation/pgtap-repeat.log"

      - name: Stop disposable database
        if: always()
        timeout-minutes: 2
        run: supabase stop --project-id Interest_Shield --no-backup

      - name: Upload database isolation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-isolation-proof
          path: ${{ runner.temp }}/backend-isolation
          if-no-files-found: warn
